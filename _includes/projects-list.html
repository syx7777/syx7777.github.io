{% include base_path %}
{% assign projects = site.portfolio | sort: "date" | reverse %}
{% if projects.size > 0 %}
  {% for post in projects %}
    {% include archive-single.html %}
  {% endfor %}
{% else %}
  <p class="lang-en">Projects will be added here soon.</p>
  <p class="lang-zh">项目即将上线。</p>
{% endif %}
